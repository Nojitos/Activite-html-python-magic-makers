{% extends 'base.html' %}
<!-- DEFI : CREER UN FORMULAIRE AVEC 3 CHAMPS / INPUTS avec chacun leur label :
                * NOM 
                * MDP
                * MDP verif
                
                + un bouton pour valider le post -->
{% block content %}
        {% if succes %}
                <p class="text-lg text-red-700 pb-4 text-xl text-center">{{ succes }}</p>
        {% endif %}

        <div class="flex items-center justify-center">
                <form method = "POST" action="{{url_for('publier_annonce')}}">
                        <h1 class = "font-bold text-2xl mb-4 text-center">Publier une annonce :</h1>
                        <div class = "mb-4">
                                <label class = "block text-sm text-gray-700 semi-bold mb-2"> Titre </label>
                                <input class = "bg-grey-100 w-full p-3 border rounded" name ="titre" placeholder = "Titre de l'annonce">
                        </div>
                        <div  class = "mb-4" >
                                <label class = "block text-sm text-gray-700 semi-bold mb-2" > description </label>
                                <textarea class="bg-grey-100 w-full p-3 border rounded" name="description" placeholder="Décris ton annonce"></textarea>
                        </div>
                        <div class="flex items-center">
                                <button class="bg-amber-400 hover:bg-amber-600 text-white font-bold rounded px-4 py-2" type="submit">Publier</button>
                        </div>
                </form>
        </div>
{% endblock %}
